<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardume | Agenda de Aulas IECOS</title>
    <script>
        // Endereco antigo (GitHub): a agenda mudou para o servidor da UFPA em 05/11/2026.
        // Leva o aluno para o endereco novo mantendo o que veio no link (QR codes antigos).
        if (/\.github\.io$/i.test(location.hostname)) {
            location.replace('https://cardume.iecos.ufpa.br/agenda_publica.html' + location.search + location.hash);
        }
    </script>
    <link rel="stylesheet" href="css/style.css?v=202611281744">
    <link rel="stylesheet" href="css/agenda_publica.css?v=202611281744">
</head>

<body>
    <div class="pub-shell">
        <header class="pub-hero">
            <div class="pub-marca">
                <img class="pub-marca-logo" src="img/cardume_agenda_1x.png"
                    srcset="img/cardume_agenda_1x.png 1x, img/cardume_agenda_2x.png 2x"
                    alt="Cardume – Planejador Acadêmico" width="300" height="84">
                <img class="pub-marca-ufpa" src="img/ufpa_sidebar_1x.png"
                    srcset="img/ufpa_sidebar_1x.png 1x, img/ufpa_sidebar_2x.png 2x, img/ufpa_sidebar_3x.png 3x"
                    alt="UFPA" title="Universidade Federal do Pará" width="40" height="50">
            </div>
            <h1 class="pub-titulo">Agenda de Aulas</h1>
        </header>

        <div class="pub-main">
            <div class="pub-plan-switch" id="pub-plan-switch" hidden>
                <label for="pub-sel-ano">Ano</label>
                <select id="pub-sel-ano" class="pub-select" aria-label="Selecionar o ano"></select>
                <label for="pub-sel-plano">Per&iacute;odo letivo</label>
                <select id="pub-sel-plano" class="pub-select" aria-label="Selecionar per&iacute;odo letivo publicado"></select>
            </div>
            <div class="pub-tabs" role="tablist" aria-label="Modos de consulta">
                <button id="tab-discente" type="button" class="pub-tab active" role="tab" aria-selected="true">Agenda
                    Discente</button>
                <button id="tab-docente" type="button" class="pub-tab" role="tab" aria-selected="false">Agenda
                    Docente</button>
            </div>

            <section class="pub-panel">
                <section id="view-discente" class="pub-view">
                    <div class="pub-controls">
                        <!-- Unidade, Curso e Turma: rotulo ao lado da caixinha, uma linha cada -->
                        <div class="pub-group pub-linhas">
                            <label for="public-sel-unidade">Unidade</label>
                            <select id="public-sel-unidade" class="pub-select"></select>
                            <label for="public-sel-curso">Curso</label>
                            <select id="public-sel-curso" class="pub-select">
                                <option value="">Carregando cursos...</option>
                            </select>
                            <label for="public-sel-turma">Turma</label>
                            <select id="public-sel-turma" class="pub-select" disabled>
                                <option value="">Escolha o curso</option>
                            </select>
                        </div>

                        <div class="pub-group">
                            <label>M&ecirc;s</label>
                            <p class="pub-hint">Escolha o m&ecirc;s para ver as aulas da turma.</p>
                            <div id="container-meses-discente" class="pub-pillbox">
                                <span class="pub-empty">Aguardando turma...</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="view-docente" class="pub-view" hidden>
                    <div class="pub-controls">
                        <div class="pub-group is-half">
                            <label for="inp-docente-publico">1. Professor</label>
                            <p class="pub-hint">Busque o professor para ver suas aulas.</p>
                            <div class="pub-autocomplete">
                                <input id="inp-docente-publico" class="pub-input" type="text" autocomplete="off"
                                    placeholder="Digite o nome do professor...">
                                <button id="btn-limpar-docente-publico" type="button" class="pub-clear-btn"
                                    title="Limpar">&times;</button>
                                <ul id="lista-sugestoes-publico" class="pub-suggestions"></ul>
                            </div>
                        </div>

                        <div id="docente-month-group" class="pub-group is-half">
                            <label>2. Resumo ou m&ecirc;s</label>
                            <p class="pub-hint">Resumo dos PLs ou calend&aacute;rio do m&ecirc;s.</p>
                            <div id="container-meses-docente" class="pub-pillbox">
                                <span class="pub-empty">Aguardando professor...</span>
                            </div>
                        </div>
                    </div>
                </section>
            </section>



            <section id="resultado-agenda" class="pub-result"></section>
        </div>
    </div>

    <button id="btn-topo" class="btn-topo" title="Voltar ao topo">&#8593;</button>

    <div id="slot-lens" class="slot-lens" hidden></div>
    <div id="day-lens" class="day-lens" hidden></div>

    <script type="module" src="js/agenda_publica.js?v=202611281744"></script>
</body>

</html>
